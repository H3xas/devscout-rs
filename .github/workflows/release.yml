name: Release

# Trigger design (documented per contract):
#   - Pushing a tag `v*` builds and attaches release binaries for
#     linux/macos/windows. It NEVER publishes to crates.io by itself.
#   - Publishing to crates.io is opt-in only, via a manual `workflow_dispatch`
#     run with the `publish` input set to true (choose the tag as the ref
#     to dispatch against), AND only when the CARGO_REGISTRY_TOKEN repo
#     secret is configured. A dry-run publish always runs, on every trigger,
#     to keep the manifest publishable.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io (requires CARGO_REGISTRY_TOKEN secret)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    # Only build/attach binaries on an actual tag push, not on a manual
    # workflow_dispatch run (which exists solely for the crates.io opt-in).
    if: github.event_name == 'push'
    name: Build (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary + sha256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="devscout${{ matrix.ext }}"
          ASSET_NAME="devscout-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext }}"
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          cp "$SRC" "$ASSET_NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          else
            shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
          fi
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Create release (idempotent)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes || true

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET_NAME" "$ASSET_NAME.sha256" --clobber

  crates-io:
    name: crates.io publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Always runs: keeps the manifest publishable without publishing anything.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      # Real publish is gated on BOTH:
      #   1. explicit opt-in: workflow_dispatch with input publish=true
      #   2. CARGO_REGISTRY_TOKEN repo secret being configured
      # A tag push alone never reaches this step.
      - name: cargo publish
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              github.event.inputs.publish == 'true' &&
              secrets.CARGO_REGISTRY_TOKEN != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
