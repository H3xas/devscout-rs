name: Release

# Trigger design (documented per contract):
#   - Pushing a tag `v*` builds and attaches release binaries for
#     linux/macos/windows, each signed (Sigstore, keyless) and attested
#     (GitHub build provenance), plus a CycloneDX SBOM for the release. It
#     NEVER publishes to crates.io by itself.
#   - Publishing to crates.io is opt-in only, via a manual `workflow_dispatch`
#     run with the `publish` input set to true (choose the tag as the ref
#     to dispatch against), using crates.io Trusted Publishing (OIDC) — no
#     long-lived registry token is stored in this repository. See
#     RELEASING.md for the one-time crates.io setup. A dry-run publish
#     always runs, on every trigger, to keep the manifest publishable.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io (requires crates.io Trusted Publishing to be configured — see RELEASING.md)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    # Only build/attach binaries on an actual tag push, not on a manual
    # workflow_dispatch run (which exists solely for the crates.io opt-in).
    if: github.event_name == 'push'
    name: Build (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary + sha256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="devscout${{ matrix.ext }}"
          ASSET_NAME="devscout-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext }}"
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          cp "$SRC" "$ASSET_NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          else
            shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
          fi
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      # GitHub build provenance: proves this exact binary was built by this
      # exact workflow run, from this exact commit. Verify with:
      #   gh attestation verify <asset> --repo H3xas/devscout-rs
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET_NAME }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless (Sigstore/Fulcio/Rekor) signature via the workflow's own OIDC
      # identity — no signing key is stored anywhere. Produces a
      # `.sigstore.json` bundle alongside the existing `.sha256` sidecar.
      # Verify with:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp 'https://github.com/H3xas/devscout-rs/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     <asset>
      - name: Sign binary (cosign, keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "$ASSET_NAME.sigstore.json" "$ASSET_NAME"

      - name: Create release (idempotent)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes || true

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "$ASSET_NAME" "$ASSET_NAME.sha256" "$ASSET_NAME.sigstore.json" \
            --clobber

  sbom:
    if: github.event_name == 'push'
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --format json
          # cargo-cyclonedx names its output after the package; normalize it
          # to a fixed, predictable release-asset name rather than assuming
          # one exact upstream filename.
          sbom_file=$(find . -maxdepth 2 \( -name '*.cdx.json' -o -name 'bom.json' \) -print -quit)
          if [ -z "$sbom_file" ]; then
            echo "::error::cargo cyclonedx did not produce an SBOM file where expected"
            exit 1
          fi
          cp "$sbom_file" devscout-sbom.cdx.json

      - name: Create release (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes || true

      - name: Upload SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" devscout-sbom.cdx.json --clobber

  crates-io:
    name: crates.io publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Always runs: keeps the manifest publishable without publishing anything.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      # Real publish is gated on BOTH:
      #   1. explicit opt-in: workflow_dispatch with input publish=true
      #   2. crates.io Trusted Publishing being configured for this repo and
      #      this workflow file (one-time setup, see RELEASING.md)
      # A tag push alone never reaches this step, and no long-lived
      # CARGO_REGISTRY_TOKEN secret is stored in this repository.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
