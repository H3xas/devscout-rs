name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # This is a binary crate: commit Cargo.lock so builds are reproducible.
      # If Cargo.lock isn't committed yet, fall back to an unlocked build
      # rather than failing CI outright.
      - name: Check for committed Cargo.lock
        id: lockfile
        run: |
          if [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cargo.lock is not committed. Commit it for reproducible builds; falling back to an unlocked build for now."
          fi

      - name: Build (locked)
        if: steps.lockfile.outputs.present == 'true'
        run: cargo build --locked --all-targets

      - name: Build (unlocked fallback, no Cargo.lock committed)
        if: steps.lockfile.outputs.present == 'false'
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # v0.1.0: fmt/clippy gates are intentionally skipped so first release
      # isn't blocked on style convergence. fmt only runs, and only as a
      # check, once the project has opted into a convention via rustfmt.toml.
      - name: Check for rustfmt.toml
        id: rustfmt_cfg
        run: |
          if [ -f rustfmt.toml ] || [ -f .rustfmt.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo fmt --check
        if: steps.rustfmt_cfg.outputs.present == 'true'
        run: cargo fmt --all -- --check

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keeps Cargo.toml / crate metadata publishable at all times, without
      # publishing anything. Runs on every push/PR to main.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  semantic-audit:
    name: Semantic oracle audit (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to the feature band the oracle is built and snapshotted
          # against; `9.0.x` would float across bands and can change Roslyn
          # behaviour under the committed oracle diff.
          dotnet-version: 9.0.3xx

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tools/scout-semantic/packages.lock.json', 'fixtures/csharp-semantic/Directory.Packages.props') }}

      - name: Restore (oracle locked, fixture CPM-pinned)
        run: |
          dotnet restore tools/scout-semantic --locked-mode
          dotnet restore fixtures/csharp-semantic/Fixture.sln
          dotnet restore fixtures/csharp-flowtrace/Fixture.sln

      - name: Build oracle
        run: dotnet build tools/scout-semantic --no-restore -c Release

      - name: Run oracle on the fixture solution
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-semantic/Fixture.sln --root fixtures/csharp-semantic \
            --out out/semantic/refs.jsonl --units out/semantic/units.jsonl --strict

      - name: Oracle output matches the committed snapshot
        run: |
          diff -u fixtures/csharp-semantic/oracle/refs.jsonl  out/semantic/refs.jsonl
          diff -u fixtures/csharp-semantic/oracle/units.jsonl out/semantic/units.jsonl

      - name: Run the oracle in flow-tracer facts mode on its own fixture
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-flowtrace/Fixture.sln --root fixtures/csharp-flowtrace \
            --emit flowtrace-facts --facts out/facts/csharp-flowtrace.json \
            --publish-calls SubmitJob --no-git --strict

      - name: Facts output matches the committed snapshot
        run: diff -u fixtures/csharp-flowtrace/facts.json out/facts/csharp-flowtrace.json

      - name: Build devscout
        run: cargo build --locked --release

      - name: Index an isolated copy of the fixture and audit it
        env:
          HOME: ${{ runner.temp }}/home
          SCOUT_REGISTRY: ${{ runner.temp }}/home/repos.json
          SCOUT_CONTENT_DB: ${{ runner.temp }}/home/content.db
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/semantic-repo"
          rsync -a --exclude bin --exclude obj fixtures/csharp-semantic/src fixtures/csharp-semantic/tests "$RUNNER_TEMP/semantic-repo/"
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" init --no-hooks --no-map
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" map src tests
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" audit --semantic "$PWD/out/semantic/refs.jsonl" --units "$PWD/out/semantic/units.jsonl"
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" audit --semantic "$PWD/out/semantic/refs.jsonl" --units "$PWD/out/semantic/units.jsonl" --assert "$PWD/fixtures/csharp-semantic/expected.json"
