name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Comment hygiene
        run: python3 .claude/hooks/comment-hygiene.py --scan

      - name: Comment hygiene (commit messages)
        if: github.event_name == 'pull_request'
        run: python3 .claude/hooks/comment-hygiene.py --scan-commits origin/${{ github.base_ref }}..HEAD

      - name: Comment hygiene (selfcheck)
        run: python3 .claude/hooks/comment-hygiene.py --selfcheck

      - name: Architecture guide names every module
        run: sh tools/check-architecture.sh

      - name: Size and complexity ratchet
        run: sh tools/check-size-and-complexity.sh

      - name: Size and complexity ratchet self-test
        run: sh tools/check-size-and-complexity-selftest.sh

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # This is a binary crate: commit Cargo.lock so builds are reproducible.
      # If Cargo.lock isn't committed yet, fall back to an unlocked build
      # rather than failing CI outright.
      - name: Check for committed Cargo.lock
        id: lockfile
        run: |
          if [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cargo.lock is not committed. Commit it for reproducible builds; falling back to an unlocked build for now."
          fi

      - name: Build (locked)
        if: steps.lockfile.outputs.present == 'true'
        run: cargo build --locked --all-targets

      - name: Build (unlocked fallback, no Cargo.lock committed)
        if: steps.lockfile.outputs.present == 'false'
        run: cargo build --all-targets

      - name: cargo clippy
        run: cargo clippy --lib --bins --locked

      - name: Test
        run: cargo test --all-targets

      # v0.1.0: fmt/clippy gates are intentionally skipped so first release
      # isn't blocked on style convergence. fmt only runs, and only as a
      # check, once the project has opted into a convention via rustfmt.toml.
      - name: Check for rustfmt.toml
        id: rustfmt_cfg
        run: |
          if [ -f rustfmt.toml ] || [ -f .rustfmt.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo fmt --check
        if: steps.rustfmt_cfg.outputs.present == 'true'
        run: cargo fmt --all -- --check

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Keeps Cargo.toml / crate metadata publishable at all times, without
      # publishing anything. Runs on every push/PR to main.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  semantic-audit:
    name: Semantic oracle audit (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to the exact patch the build-context fixture is snapshotted
          # against, not just its feature band: the envelope's own `versions`
          # block records the resolved SDK/MSBuild version and folds it into
          # every fingerprint, so a floating `9.0.3xx` band could resolve to a
          # newer patch on the runner and diff the committed snapshot on SDK
          # servicing alone, unrelated to any change this repository made.
          dotnet-version: 9.0.305

      - uses: actions/setup-dotnet@v4
        with:
          # The qualification tree's own global.json pins one exact patch with
          # rollForward disabled, independent of the floating band above, so
          # its restore/build is reproducible even if the band's latest patch moves.
          dotnet-version: 9.0.305

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tools/scout-semantic/packages.lock.json', 'tools/scout-semantic.Tests/packages.lock.json', 'fixtures/csharp-semantic/Directory.Packages.props', 'fixtures/csharp-target-qualification/Directory.Packages.props') }}

      - name: Restore (oracle locked, context tests locked, fixtures CPM-pinned or plain)
        run: |
          dotnet restore tools/scout-semantic --locked-mode
          dotnet restore tools/scout-semantic.Tests --locked-mode
          dotnet restore fixtures/csharp-semantic/Fixture.sln
          dotnet restore fixtures/csharp-flowtrace/Fixture.sln
          # Per project, not the .sln: the fixture's own Fixture.sln names a
          # Vanished project that deliberately does not exist on disk (the
          # fixture case for a project the workspace never sees at all), and
          # restoring the whole .sln fails outright on that entry, unlike
          # `dotnet run`'s own MSBuildWorkspace load, which tolerates it.
          dotnet restore fixtures/csharp-context/src/Clean/Clean.csproj
          dotnet restore fixtures/csharp-context/src/Legacy/Legacy.csproj
          dotnet restore fixtures/csharp-context/src/Broken/Broken.csproj

      - name: Build oracle
        run: dotnet build tools/scout-semantic --no-restore -c Release

      - name: Context schema unit tests
        run: dotnet test tools/scout-semantic.Tests --no-restore -c Release

      - name: Run oracle on the fixture solution
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-semantic/Fixture.sln --root fixtures/csharp-semantic \
            --out out/semantic/refs.jsonl --units out/semantic/units.jsonl --strict

      - name: Oracle output matches the committed snapshot
        run: |
          diff -u fixtures/csharp-semantic/oracle/refs.jsonl  out/semantic/refs.jsonl
          diff -u fixtures/csharp-semantic/oracle/units.jsonl out/semantic/units.jsonl

      - name: Run the oracle in flow-tracer facts mode on its own fixture
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-flowtrace/Fixture.sln --root fixtures/csharp-flowtrace \
            --emit flowtrace-facts --facts out/facts/csharp-flowtrace.json \
            --publish-calls SubmitJob --no-git --strict

      - name: Facts output matches the committed snapshot
        run: diff -u fixtures/csharp-flowtrace/facts.json out/facts/csharp-flowtrace.json

      - name: Restore the compiler-facts fixture (package-free)
        run: dotnet restore fixtures/csharp-compiler-facts/Fixture.csproj

      - name: Run the oracle in compiler-facts protocol mode on its own fixture
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-compiler-facts/Fixture.csproj --root fixtures/csharp-compiler-facts \
            --emit compiler-facts --compiler-facts out/compiler-facts/csharp-compiler-facts.json \
            --tfm net9.0 -p Configuration=Debug -p Platform=AnyCPU --no-git

      - name: Compiler-facts output matches the committed snapshot
        run: diff -u fixtures/csharp-compiler-facts/compiler-facts.json out/compiler-facts/csharp-compiler-facts.json

      # The committed snapshot is the engine's own unflagged default (which
      # now includes occurrences); this proves the byte identity of every
      # existing output field still holds under an explicit, narrower
      # request -- field-by-field, rather than doubling the committed
      # fixture's size with a second full snapshot.
      - name: Capability-restricted run carries no occurrences key and reports its own provided set
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-compiler-facts/Fixture.csproj --root fixtures/csharp-compiler-facts \
            --emit compiler-facts --compiler-facts out/compiler-facts/csharp-compiler-facts-restricted.json \
            --tfm net9.0 -p Configuration=Debug -p Platform=AnyCPU --capabilities symbols,diagnostics --no-git
          if jq -e 'has("occurrences")' out/compiler-facts/csharp-compiler-facts-restricted.json > /dev/null; then
            echo "::error::a capabilities-restricted run must carry no occurrences key at all"
            exit 1
          fi
          provided=$(jq -c '.capabilities.provided' out/compiler-facts/csharp-compiler-facts-restricted.json)
          if [ "$provided" != '["symbols","diagnostics"]' ]; then
            echo "::error::expected capabilities.provided [\"symbols\",\"diagnostics\"], got $provided"
            exit 1
          fi

      - name: Run the oracle in context mode on its own fixture (default selection)
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-context/Fixture.sln --root fixtures/csharp-context \
            --emit context --context out/context/csharp-context.json

      - name: Context output matches the committed snapshot
        run: diff -u fixtures/csharp-context/context.json out/context/csharp-context.json

      - name: Two context runs over the same pinned inputs are byte-identical
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-context/Fixture.sln --root fixtures/csharp-context \
            --emit context --context out/context/csharp-context-2.json
          diff -u out/context/csharp-context.json out/context/csharp-context-2.json

      # Not every record in the default selection is complete (Legacy's own
      # net472 control is a deliberate binding error) -- --strict is required
      # to exit 2 rather than the default run's own exit 0, so the negative
      # case is checked as explicitly as the positive ones above.
      - name: --strict exits non-zero for an artifact that is not complete
        run: |
          if dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-context/Fixture.sln --root fixtures/csharp-context \
            --emit context --context out/context/csharp-context-strict.json --strict; then
            echo "::error::--strict exited 0 for a non-complete context artifact"
            exit 1
          fi

      # The check above also passes with the artifact-level rollup deleted,
      # because the whole-solution run already fails --strict's older,
      # pre-existing check (Vanished never reaches the workspace at all).
      # Clean.csproj on its own trips no such pre-existing check -- it loads
      # cleanly -- so this is the one case only the new rollup can fail.
      - name: --strict exits non-zero for a single partial project via the rollup alone
        run: |
          if dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-context/src/Clean/Clean.csproj --root fixtures/csharp-context \
            --emit context --context out/context/csharp-context-strict-clean.json --strict; then
            echo "::error::--strict exited 0 for a project only the rollup demotes"
            exit 1
          fi

      # Broken and Vanished's own failures come from MSBuildWorkspace's
      # whole-solution load, which happens before --projects' own per-group
      # filtering -- so a --projects-scoped *.sln run still carries their
      # unrelated diagnostics. A project passed directly, bypassing the
      # solution entirely, isolates the scoped-and-healthy case --strict
      # exiting 0 depends on.
      - name: --projects excludes rather than fails a filtered-out project
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-context/Fixture.sln --root fixtures/csharp-context \
            --projects Legacy --tfm net9.0 \
            --emit context --context out/context/csharp-context-projects-filtered.json
          for name in Clean Broken; do
            state=$(jq -r --arg n "$name" '.compilations[] | select(.identity.projectName == $n) | .state' out/context/csharp-context-projects-filtered.json)
            reason=$(jq -r --arg n "$name" '.compilations[] | select(.identity.projectName == $n) | .reason' out/context/csharp-context-projects-filtered.json)
            if [ "$state" != "excluded" ] || [ "$reason" != "not-requested" ]; then
              echo "::error::$name: expected excluded/not-requested, got $state/$reason"
              exit 1
            fi
          done

      - name: --strict exits zero for a healthy scoped run
        run: |
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-context/src/Legacy/Legacy.csproj --root fixtures/csharp-context \
            --tfm net9.0 \
            --emit context --context out/context/csharp-context-scoped-strict.json --strict

      - name: Build devscout
        run: cargo build --locked --release

      - name: Index an isolated copy of the fixture and audit it
        env:
          HOME: ${{ runner.temp }}/home
          SCOUT_REGISTRY: ${{ runner.temp }}/home/repos.json
          SCOUT_CONTENT_DB: ${{ runner.temp }}/home/content.db
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/semantic-repo"
          rsync -a --exclude bin --exclude obj fixtures/csharp-semantic/src fixtures/csharp-semantic/tests "$RUNNER_TEMP/semantic-repo/"
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" init --no-hooks --no-map
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" map src tests
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" audit --semantic "$PWD/out/semantic/refs.jsonl" --units "$PWD/out/semantic/units.jsonl"
          ./target/release/devscout -C "$RUNNER_TEMP/semantic-repo" audit --semantic "$PWD/out/semantic/refs.jsonl" --units "$PWD/out/semantic/units.jsonl" --assert "$PWD/fixtures/csharp-semantic/expected.json"

      # The base/interface direction fixture: its own solution, its own
      # committed snapshot, the same oracle-diff-then-audit flow. Restored
      # here rather than above so the two fixtures stay independent files.
      - name: Run oracle on the direction fixture and diff the committed snapshot
        run: |
          dotnet restore fixtures/csharp-direction/Direction.sln
          dotnet run --project tools/scout-semantic --no-build -c Release -- \
            fixtures/csharp-direction/Direction.sln --root fixtures/csharp-direction \
            --out out/direction/refs.jsonl --units out/direction/units.jsonl --strict
          diff -u fixtures/csharp-direction/oracle/refs.jsonl  out/direction/refs.jsonl
          diff -u fixtures/csharp-direction/oracle/units.jsonl out/direction/units.jsonl

      - name: Index an isolated copy of the direction fixture and audit it
        env:
          HOME: ${{ runner.temp }}/home-direction
          SCOUT_REGISTRY: ${{ runner.temp }}/home-direction/repos.json
          SCOUT_CONTENT_DB: ${{ runner.temp }}/home-direction/content.db
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/direction-repo"
          rsync -a --exclude bin --exclude obj fixtures/csharp-direction/src "$RUNNER_TEMP/direction-repo/"
          ./target/release/devscout -C "$RUNNER_TEMP/direction-repo" init --no-hooks --no-map
          ./target/release/devscout -C "$RUNNER_TEMP/direction-repo" map src
          ./target/release/devscout -C "$RUNNER_TEMP/direction-repo" audit --semantic "$PWD/out/direction/refs.jsonl" --units "$PWD/out/direction/units.jsonl"
          ./target/release/devscout -C "$RUNNER_TEMP/direction-repo" audit --semantic "$PWD/out/direction/refs.jsonl" --units "$PWD/out/direction/units.jsonl" --assert "$PWD/fixtures/csharp-direction/expected.json"

      # The .NET target/project/framework qualification tree: its own global.json SDK pin,
      # restored and rebuilt row by row, then diffed byte-for-byte against the committed
      # capability snapshots. This is the only step in CI that shells out through the tree's
      # own composition script rather than the oracle directly.
      - name: Regenerate and diff the .NET target qualification matrix
        run: python3 tools/qualify-dotnet-targets.py --check

  supply-chain:
    name: cargo deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Config lives in deny.toml at the repo root; run it locally the same
      # way with `cargo install cargo-deny --locked && cargo deny check`.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
